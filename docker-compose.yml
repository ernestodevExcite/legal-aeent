version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: legal_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 9G
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: all
        #       capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: legal_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./data:/app/data
      - ./prompts:/app/prompts
    environment:
      - OLLAMA_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - LLM_MODEL=qwen2.5:7b
      - EMBED_MODEL=nomic-embed-text
      - COLLECTION_NAME=contratos
      - SECRET_KEY=${SECRET_KEY}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SLACK_WEBHOOK=${SLACK_WEBHOOK:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
    depends_on:
      - ollama
      - qdrant
    deploy:
      resources:
        limits:
          memory: 512M

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: legal_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./ui:/app
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: legal_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - ui
      - api

volumes:
  ollama_data:
  qdrant_data:
